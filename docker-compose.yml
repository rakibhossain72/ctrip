services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  app:
    build: .
    env_file: .env
    command: sh -c "python migrate.py upgrade && uvicorn server:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/payment_db
      DATABASE_URL_DEV: postgresql+asyncpg://postgres:postgres@db:5432/payment_db
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-development}
      RPC_URL: http://host.docker.internal:8545
      PRIVATE_KEY: ${PRIVATE_KEY}
      MNEMONIC: ${MNEMONIC:-test test test test test test test test test test test junk}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    ports:
      - "8000:8000"
    expose:
      - "8000"

  worker:
    build: .
    env_file: .env
    command: python run_worker.py
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/payment_db
      DATABASE_URL_DEV: postgresql+asyncpg://postgres:postgres@db:5432/payment_db
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-development}
      RPC_URL: http://host.docker.internal:8545
      PRIVATE_KEY: ${PRIVATE_KEY}
      MNEMONIC: ${MNEMONIC:-test test test test test test test test test test test junk}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
