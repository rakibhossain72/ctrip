{% extends "base.html" %}
{% block title %}Sign In — Ctrip Admin{% endblock %}

{% block head %}
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--muted); }

  .login-wrap { width: 100%; max-width: 380px; padding: 16px; }

  .login-logo { text-align: center; margin-bottom: 32px; }
  .login-logo .logo-mark {
    width: 40px; height: 40px;
    background: var(--primary);
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-foreground);
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .login-logo h1 { font-size: 1.25rem; }
  .login-logo p { font-size: 0.875rem; color: var(--muted-foreground); margin-top: 4px; }

  .login-card { padding: 32px; }

  .error-banner {
    display: {% if error %}block{% else %}none{% endif %};
    background: #fee2e2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 0.875rem;
    margin-bottom: 16px;
  }
</style>
{% endblock %}

{% block body %}
<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-mark">C</div>
    <h1>Ctrip Admin</h1>
    <p>Sign in to your account</p>
  </div>

  <div class="card login-card">
    <div class="error-banner">{{ error if error else '' }}</div>

    <form method="post" action="/admin/login">
      <div class="form-group mb-4">
        <label class="label" for="username">Username</label>
        <input class="input" type="text" id="username" name="username" placeholder="admin" required autofocus />
      </div>
      <div class="form-group mb-6">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
